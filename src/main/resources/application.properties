# ============================================================
# application.properties - ms-pedidos360-notify
# Proyecto: Pedidos360 - Evaluacion Parcial N° 2 / 3
# ============================================================

spring.application.name=ms-pedidos360-notify
server.port=8082

# ============================================================
# CONEXIÓN A RABBITMQ
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ============================================================
# CONFIGURACIÓN DEL CONSUMIDOR (MANUAL ACK)
# ============================================================
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Nombres Centralizados de Colas ---
app.rabbitmq.queues.email=q.cmd.email
app.rabbitmq.queues.kitchen=q.cmd.kitchen
app.rabbitmq.queues.invoice=q.cmd.invoice

# --- Nombres Centralizados de Dead Letter Queues (DLQ) ---
app.rabbitmq.queues.email-dlq=q.cmd.email.dlq
app.rabbitmq.queues.kitchen-dlq=q.cmd.kitchen.dlq
app.rabbitmq.queues.invoice-dlq=q.cmd.invoice.dlq

# ============================================================
# ACTUATOR & LOGGING
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.cl.duoc.pedidos360=DEBUG
logging.level.org.springframework.amqp=INFO

# ============================================================
# APACHE KAFKA CONFIGURATION (EVALUACION PARCIAL N° 3 / 5)
# Consumer Group Independiente: cg-audit-logger (Fan-out / Auditoría)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.group-id=cg-audit-logger
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

app.kafka.topics.orders-events=pedidos360.orders.events
app.kafka.topics.analytics-metrics=pedidos360.analytics.metrics
app.kafka.topics.orders-dlt=pedidos360.orders.events.dlt

